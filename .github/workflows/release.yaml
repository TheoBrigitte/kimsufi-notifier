name: release

on:
  push:
    tags:
    - v*

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
    - name: dependencies
      run: |
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1 \
          g++-aarch64-linux-gnu=4:13.2.0-7ubuntu1
    - uses: goreleaser/goreleaser-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        args: release --clean
        version: v2.12.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_BRANCH: ${{ vars.BUILD_BRANCH }}
        BUILD_USER: ${{ vars.BUILD_USER }}
